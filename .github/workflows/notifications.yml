name: Upptime Notifications

on:
  push:
    paths:
      - "history/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed history files
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD | grep "^.history/" || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Process incidents
        if: steps.changes.outputs.files != ''
        run: |
          for file in ${{ steps.changes.outputs.files }}
          do
            STATUS=$(jq -r '.status' $file)
            NAME=$(jq -r '.url' $file)

            if [ "$STATUS" = "down" ]; then
              MESSAGE="🚨 DOWN: $NAME"
            else
              MESSAGE="✅ RECOVERED: $NAME"
            fi

            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$MESSAGE\"}" \
              ${{ secrets.SLACK_WEBHOOK_1 }}
          done

      - name: Process incidents
        if: steps.changes.outputs.files != ''
        run: |
          for file in ${{ steps.changes.outputs.files }}
          do
            STATUS=$(jq -r '.status' $file)
            NAME=$(jq -r '.url' $file)

            if [ "$STATUS" = "down" ]; then
              MESSAGE="🚨 DOWN: $NAME"
            else
              MESSAGE="✅ RECOVERED: $NAME"
            fi

            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$MESSAGE\"}" \
              ${{ secrets.SLACK_WEBHOOK_2 }}
          done
